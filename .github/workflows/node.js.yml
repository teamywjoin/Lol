import static spark.Spark.*;
import com.google.gson.*;
import java.util.*;
import java.net.http.*;
import java.net.URI;
import java.net.http.HttpRequest.BodyPublishers;
import java.net.http.HttpResponse.BodyHandlers;

public class GPTServer {
    private static final String OPENAI_API_KEY = "YOUR_OPENAI_API_KEY";

    public static void main(String[] args) {
        port(4567);
        post("/gpt", (req, res) -> {
            res.type("application/json");
            Gson gson = new Gson();
            Map<String, String> data = gson.fromJson(req.body(), Map.class);
            String prompt = data.get("prompt");

            String gptResponse = callOpenAI(prompt);

            return gson.toJson(Map.of("response", gptResponse));
        });
    }

    private static String callOpenAI(String prompt) throws Exception {
        HttpClient client = HttpClient.newHttpClient();

        String body = """
        {
          "model": "gpt-4o-mini",
          "messages": [{"role": "user", "content": "%s"}]
        }
        """.formatted(prompt);

        HttpRequest request = HttpRequest.newBuilder()
            .uri(URI.create("https://api.openai.com/v1/chat/completions"))
            .header("Content-Type", "application/json")
            .header("Authorization", "Bearer " + OPENAI_API_KEY)
            .POST(BodyPublishers.ofString(body))
            .build();

        HttpResponse<String> response = client.send(request, BodyHandlers.ofString());

        JsonObject json = JsonParser.parseString(response.body()).getAsJsonObject();
        String result = json
            .getAsJsonArray("choices")
            .get(0).getAsJsonObject()
            .getAsJsonObject("message")
            .get("content").getAsString();

        return result;
    }
}
